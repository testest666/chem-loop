<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>化学错题闭环 · 人教版高二</title>
<style>
:root{--bg:#F6F5F1;--card:#FFFFFF;--ink:#2C2C2A;--sub:#5F5E5A;--line:#D3D1C7;--p:#534AB7;--pl:#EEEDFE;--g:#0F6E56;--gl:#E1F5EE;--r:#A32D2D;--rl:#FCEBEB;--a:#854F0B;--al:#FAEEDA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:10}
.h-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:960px;margin:0 auto}
h1{font-size:16px;font-weight:500;flex:1;min-width:180px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 14px;font-size:13px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--pl);color:var(--p);font-weight:500}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:9}
.tabs{display:flex;gap:4px;max-width:960px;margin:0 auto;padding:6px 12px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub)}
.tabs button.on{background:var(--pl);color:var(--p);font-weight:500}
main{max-width:960px;margin:0 auto;padding:16px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:15px;font-weight:500;margin-bottom:10px}
h3{font-size:13px;font-weight:500;margin:12px 0 6px}
.hint{color:var(--sub);font-size:12px;margin:4px 0 10px}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:#fff}
textarea{min-height:72px;resize:vertical}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;background:var(--pl);color:var(--p);font-weight:500;margin:4px 4px 4px 0}
.btn.pri{background:var(--p);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn.warn{background:var(--rl);color:var(--r)}
.btn.sm{padding:5px 10px;font-size:12px;margin:2px 2px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;background:#fff;color:var(--sub)}
.chip.on{background:var(--pl);border-color:var(--p);color:var(--p);font-weight:500}
.chip.on.g{background:var(--gl);border-color:var(--g);color:var(--g)}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;margin-left:6px}
.b-p{background:var(--pl);color:var(--p)}
.b-g{background:var(--gl);color:var(--g)}
.b-r{background:var(--rl);color:var(--r)}
.b-a{background:var(--al);color:var(--a)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;background:#fff}
.item .meta{font-size:12px;color:var(--sub);margin-bottom:6px}
.item img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;background:#fff}
.stat .n{font-size:22px;font-weight:500}
.stat .l{font-size:12px;color:var(--sub)}
.alert{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.alert.red{background:var(--rl);color:var(--r)}
.alert.a{background:var(--al);color:var(--a)}
.alert.g{background:var(--gl);color:var(--g)}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--bg);font-weight:500}
.sentence{background:var(--pl);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px}
.ok{color:var(--g);font-weight:500}
.no{color:var(--r);font-weight:500}
#printArea{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:86vw;text-align:center}
.toast.show{opacity:1}
footer{max-width:960px;margin:0 auto;padding:12px;color:var(--sub);font-size:11px}
@media print{
 header,nav,main,footer,.toast{display:none!important}
 #printArea{display:block!important}
 .pcard{page-break-after:always;border:1px solid #999;border-radius:8px;padding:14px;margin-bottom:10px}
 .pcard .side{font-size:12px;color:#555;border-bottom:1px solid #ccc;padding-bottom:6px;margin-bottom:8px}
 .pcard img{max-width:100%;max-height:300px;border:1px solid #ccc}
 .pcard .red{border:1.5px solid #A32D2D;border-radius:6px;padding:8px;margin:8px 0;color:#A32D2D}
 .pcard .back{margin-top:10px;border-top:1px dashed #999;padding-top:8px}
}
</style>
</head>
<body>
<header>
  <div class="h-row">
    <h1>化学错题闭环 · 人教版高二</h1>
    <div class="seg">
      <button id="vStu" class="on" onclick="setView('student')">学生</button>
      <button id="vPar" onclick="setView('parent')">家长</button>
    </div>
    <button class="btn sm ghost" onclick="setTab('ai')">AI 设置</button>
    <button class="btn sm ghost" onclick="exportJSON()">导出备份</button>
    <button class="btn sm ghost" onclick="document.getElementById('importFile').click()">导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this.files[0])">
  </div>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main id="app"></main>
<footer>数据存在本机浏览器（IndexedDB），清缓存/换设备前请先导出 JSON 备份。AI 校对需在「AI 设置」配置接口（照片将发往所选服务商，Key 只存本机）；未配置时用本地建议库。</footer>
<div class="toast" id="toast"></div>
<script>
"use strict";
var TAGS=[
 {g:"选必1 化学反应原理",items:["化学反应的热效应","化学反应速率","化学平衡","电离平衡","水解平衡","沉淀溶解平衡","原电池","电解池","金属的腐蚀与防护"]},
 {g:"选必2 物质结构与性质",items:["原子结构与性质","分子结构与性质","共价键与分子空间结构","晶体结构与性质","配合物"]},
 {g:"选必3 有机化学基础",items:["有机物的结构与研究方法","烃","卤代烃","醇酚","醛羧酸酯","有机合成","生物大分子"]},
 {g:"跨主题专项",items:["Nₐ判断","氧化还原与配平","离子共存","离子方程式","实验综合","同分异构体"]}
];
var STAGES=["看不出","想不到","推不动","写不好"];
var SUGGEST={
 "看不出":["漏看了题目条件（如标况/过量/溶液酸碱性）","没看出图像或表格的趋势、拐点、极值","没识别出题型模型，读完不知道在考什么","把离子方程式误当化学方程式要求"],
 "想不到":["没想到用守恒（电荷/电子/原子守恒）","没想到把条件翻译成化学语言（如'恰好沉淀'=计量关系）","没想起来这个情境对应的规律或模型","没想到从终态/差量倒推"],
 "推不动":["配平或计算失误","单位换算/有效数字出错","推理中途跳步导致混乱","公式记错或代错数据"],
 "写不好":["漏写必要步骤或依据","漏讨论过量/少量、过量产物等情形","术语/化学用语不规范","单位或有效数字不合要求"]
};
var INTERVALS=[1,2,4,7,15,30];
var state={view:"student",tab:"collect",cur:null,tagSel:[],recent:[],prefillSnap:null,draftPhotos:[],kpSel:null};

function $(s){return document.querySelector(s)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var DB={
 open:function(){return new Promise(function(res,rej){var r=indexedDB.open("chem-loop",1);
  r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains("mistakes"))db.createObjectStore("mistakes",{keyPath:"id"})};
  r.onsuccess=function(e){res(e.target.result)};r.onerror=function(e){rej(e)};})},
 put:function(o){return DB.open().then(function(db){return new Promise(function(res){var tx=db.transaction("mistakes","readwrite");tx.objectStore("mistakes").put(o);tx.oncomplete=function(){res()}})})},
 del:function(id){return DB.open().then(function(db){return new Promise(function(res){var tx=db.transaction("mistakes","readwrite");tx.objectStore("mistakes").delete(id);tx.oncomplete=function(){res()}})})},
 all:function(){return DB.open().then(function(db){return new Promise(function(res){var tx=db.transaction("mistakes","readonly");var req=tx.objectStore("mistakes").getAll();req.onsuccess=function(){res(req.result||[])};req.onerror=function(){res([])}})})}
};
var M=[];
function save(m){var i=-1;for(var k=0;k<M.length;k++)if(M[k].id===m.id)i=k;if(i>=0)M[i]=m;else M.unshift(m);return DB.put(m)}

function readImage(file){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var max=1280,w=img.width,h=img.height;if(w>max){h=h*max/w;w=max}var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",0.72))};img.src=fr.result};fr.readAsDataURL(file)})}
function pending(){return M.filter(function(m){return m.status==="collected"})}
function attributed(){return M.filter(function(m){return m.status==="attributed"})}
function dueToday(){return attributed().filter(function(m){return m.review&&m.review.next&&m.review.next<=today()})}

function setView(v){state.view=v;state.tab=v==="student"?"collect":"board";render()}
function setTab(t){state.tab=t;render()}

function render(){
 $("#vStu").className=state.view==="student"?"on":"";
 $("#vPar").className=state.view==="parent"?"on":"";
 var tabs=state.view==="student"
  ?[["collect","收集(30秒)"],["attr","归因(10分钟)"],["practice","变式·复习"],["archive","知识点归档"],["print","打印"]]
  :[["board","看板"],["warn","预警"],["archive","知识点归档"],["printP","周报打印"],["check","抽查"]];
 $("#tabs").innerHTML=tabs.map(function(t){return '<button class="'+(state.tab===t[0]?"on":"")+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+"</button>"}).join("");
 var a=$("#app");
 if(state.tab==="collect")a.innerHTML=viewCollect();
 else if(state.tab==="attr")a.innerHTML=state.cur?viewAttrForm():viewAttrList();
 else if(state.tab==="practice")a.innerHTML=viewPractice();
 else if(state.tab==="archive")a.innerHTML=viewArchive();
 else if(state.tab==="print")a.innerHTML=viewPrint(false);
 else if(state.tab==="board")a.innerHTML=viewBoard();
 else if(state.tab==="warn")a.innerHTML=viewWarn();
 else if(state.tab==="printP")a.innerHTML=viewPrint(true);
 else if(state.tab==="check")a.innerHTML=viewCheck();
 else if(state.tab==="ai")a.innerHTML=viewAI();
}

function tagChips(sel){
 var html="";
 TAGS.forEach(function(g){html+='<div class="hint" style="margin:8px 0 2px">'+esc(g.g)+"</div>";
  html+='<div class="chips">'+g.items.map(function(t){return '<span class="chip '+(sel.indexOf(t)>=0?"on":"")+'" onclick="toggleTag(\''+t+'\')">'+esc(t)+"</span>"}).join("")+"</div>"});
 if(state.recent.length){html+='<div class="hint" style="margin:10px 0 2px">最近用过（一键复用）</div><div class="chips">'
  +state.recent.slice(0,4).map(function(t){return '<span class="chip" onclick="toggleTag(\''+t+'\')">+ '+esc(t)+"</span>"}).join("")+"</div>"}
 return html;
}
function toggleTag(t){var i=state.tagSel.indexOf(t);if(i>=0)state.tagSel.splice(i,1);else state.tagSel.push(t);render()}

function viewCollect(){
 return '<div class="card"><h2>30 秒收集 <span class="badge b-p">零打字</span></h2>'
 +'<div class="hint">扣 1 分也是错题。整页拍（含错解和红叉），点一下标签，完成。归因放到每日 10 分钟时段。</div>'
 +'<label>1 · 拍照 / 选图（可多张）</label>'
 +'<input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(this.files)" style="width:100%">'
 +(state.draftPhotos.length?'<div class="chips">'+state.draftPhotos.map(function(p,i){return '<span class="chip on g">图'+(i+1)+' <span onclick="delPhoto('+i+')">✕</span></span>'}).join("")+"</div>":"")
 +'<label>2 · 知识点标签（可多选）</label>'+tagChips(state.tagSel)
 +'<label>3 · 得分情况</label><div class="chips" id="scoreChips">'
 +'<span class="chip on" id="sc1" onclick="pickScore(1)">全错</span>'
 +'<span class="chip" id="sc2" onclick="pickScore(2)">部分得分</span>'
 +'<input type="text" id="scoreText" placeholder="选『部分得分』后填：得__扣__" style="display:none;flex:1;min-width:160px"></div>'
 +'<label>4 · 来源</label><div class="chips" id="srcChips">'
 +["作业","周测","月考","课本","自测"].map(function(s,i){return '<span class="chip '+(i===0?"on":"")+'" onclick="pickSrc(this,\''+s+'\')">'+s+"</span>"}).join("")+"</div>"
 +'<button class="btn pri" onclick="saveCollect()">保存（≤30秒）</button> '
 +'<button class="btn ghost" onclick="resetCollect()">清空</button>'
 +"</div>";
}
function addPhotos(files){var arr=[].slice.call(files);if(!arr.length)return;Promise.all(arr.map(readImage)).then(function(ps){state.draftPhotos=state.draftPhotos.concat(ps);render();toast("已加入 "+ps.length+" 张图，记得点标签后保存")})}
function delPhoto(i){state.draftPhotos.splice(i,1);render()}
function pickScore(n){$("#sc1").className=n===1?"chip on":"chip";$("#sc2").className=n===2?"chip on":"chip";$("#scoreText").style.display=n===2?"inline-block":"none"}
function pickSrc(el,s){[].forEach.call(document.querySelectorAll("#srcChips .chip"),function(c){c.className="chip"});el.className="chip on"}
function resetCollect(){state.draftPhotos=[];state.tagSel=[];render()}
function saveCollect(){
 if(!state.draftPhotos.length&&!state.tagSel.length){toast("至少拍一张图或选一个标签");return}
 var st=document.querySelector("#sc1").className.indexOf("on")>=0?"全错":"部分得分";
 var src="作业";[].forEach.call(document.querySelectorAll("#srcChips .chip"),function(c){if(c.className.indexOf("on")>=0)src=c.textContent});
 var m={id:Date.now(),createdAt:today(),source:src,tags:state.tagSel.slice(),scoreType:st,
  scoreText:st==="部分得分"?($("#scoreText").value||"部分得分"):"",photos:state.draftPhotos.slice(),
  status:"collected",attrib:null,variants:[],
  review:{stageIdx:0,next:null,history:[]},parentChecks:[]};
 save(m).then(function(){
  state.tagSel.forEach(function(t){var i=state.recent.indexOf(t);if(i>=0)state.recent.splice(i,1);state.recent.unshift(t)});
  state.draftPhotos=[];state.tagSel=[];render();toast("已入库。归因放到每日 10 分钟时段");
 });
}

function viewAttrList(){
 var p=pending();
 if(!p.length)return '<div class="card"><h2>每日 10 分钟归因</h2><div class="alert g">当前没有待归因的题。先去"收集"。</div></div>';
 return '<div class="card"><h2>每日 10 分钟归因 <span class="badge b-a">待归因 '+p.length+" 题</span></h2>"
 +'<div class="hint">每题约 30-60 秒：AI 预填初稿 → 你必须至少改一处 → 填正确解法。句式模板会自动拼好。</div>'
 +p.map(function(m){return '<div class="item"><div class="meta">'+esc(m.createdAt)+" · "+esc(m.source)+" · "+(m.tags[0]||"未标")+'<span class="badge '+(m.scoreType==="部分得分"?"b-a":"b-r")+'">'+esc(m.scoreType)+"</span></div>"
  +(m.photos[0]?'<img src="'+m.photos[0]+'" alt="错题图">':"")
  +'<button class="btn pri sm" onclick="openAttr('+m.id+')">开始归因</button> '
  +'<button class="btn ghost sm" onclick="delItem('+m.id+')">删除</button></div>'}).join("")+"</div>";
}
function delItem(id){if(!confirm("确认删除这道题？"))return;DB.del(id).then(function(){M=M.filter(function(m){return m.id!==id});render();toast("已删除")})}
function openAttr(id){state.cur=M.filter(function(m){return m.id===id})[0];state.prefillSnap=null;state.aiResult=null;state.aiDecision=null;state.aiRebuttal="";render()}

function viewAttrForm(){
 var m=state.cur;
 var sug=SUGGEST[$("#stageSel")?$("#stageSel").value:"看不出"]||SUGGEST["看不出"];
 return '<div class="card"><h2>归因 · '+esc(m.tags[0]||"未标标签")+'</h2>'
 +'<button class="btn ghost sm" onclick="state.cur=null;render()">← 返回列表</button>'
 +(m.photos.map(function(p){return '<img src="'+p+'" alt="错题图">'}).join(""))
 +'<label>1 · 独立完成到第几步 / 卡在第几步</label><div class="row">'
 +'<div><input type="number" id="doneTo" min="0" placeholder="独立完成到第几步" value="'+(m.attrib?m.attrib.doneTo:"")+'"></div>'
 +'<div><input type="number" id="stuckAt" min="1" placeholder="卡在第几步" value="'+(m.attrib?m.attrib.stuckAt:"")+'"></div></div>'
 +'<label>2 · 思维段（记最先断的那一段）</label><div class="chips" id="stageChips">'
 +STAGES.map(function(s,i){return '<span class="chip '+(i===0?"on":"")+'" onclick="pickStage(this,\''+s+'\')">'+s+"</span>"}).join("")+"</div>"
 +'<label>3 · 错因知识点（跨知识点题必选：错在哪个点上）</label><div class="chips" id="kpChips">'
 +(m.tags.length?m.tags:["未分类"]).map(function(t,i){return '<span class="chip '+(i===0?"on":"")+'" onclick="pickOne(this)">'+esc(t)+"</span>"}).join("")+"</div>"
 +'<input type="text" id="kpCustom" placeholder="标签里没有？在这里补一个知识点（可选）">'
 +'<label>4 · 缺的思维动作（一句话）</label>'
 +'<div class="chips"><button class="btn sm" onclick="doPrefill()">AI 预填初稿</button>'
 +'<span class="hint" style="margin:6px">本地卡点建议库，离线可用</span></div>'
 +'<textarea id="missing" placeholder="例：没想到用电荷守恒检查配平"></textarea>'
 +'<div id="sugBox"></div>'
 +'<div class="sentence" id="sentBox">归因句式（自动拼装）：我在第 <b>?</b> 步卡住，属于 <b>?</b>，因为 <b>?</b></div>'
 +'<label>5 · 正确解法（自己写，必填）</label>'
 +'<textarea id="solution" placeholder="按标准步骤写，写清每步依据">'+(m.attrib?esc(m.attrib.solution):"")+"</textarea>"
 +'<div class="chips" style="margin-top:10px"><button class="btn" onclick="aiDiagnose()">AI 校对（看图检查我的归因）</button><span class="hint" style="margin:6px">先自己写，AI 再看图对照——需先在「AI 设置」配置接口</span></div>'
 +'<div id="aiBox"></div>'
 +'<button class="btn pri" onclick="confirmAttr()">确认归因（必须改过预填）</button> '
 +'<button class="btn ghost" onclick="state.cur=null;render()">稍后再做</button>'
 +"</div>";
}
function pickStage(el,s){[].forEach.call(document.querySelectorAll("#stageChips .chip"),function(c){c.className="chip"});el.className="chip on";updateSent()}
function doPrefill(){
 var s=document.querySelector("#stageChips .chip.on");var stage=s?s.textContent:STAGES[0];
 var list=SUGGEST[stage]||SUGGEST["看不出"];
 var v=list[Math.floor(Math.random()*list.length)];
 $("#missing").value=v;state.prefillSnap=v;updateSent();
 $("#sugBox").innerHTML='<div class="alert a">已预填初稿（本地建议库）。<b>你必须至少修改一处</b>——把话说成你这道题的具体情况，否则等于没归因。</div>'

 if(state.prefillSnap&&missing===state.prefillSnap){toast("请至少修改一处预填内容——把话说成你这道题的具体情况");return}
 var sol=$("#solution").value.trim();
 if(!sol){toast("正确解法必填（自己写）");return}
 var s=document.querySelector("#stageChips .chip.on");var stage=s?s.textContent:STAGES[0];

 m.attrib={doneTo:$("#doneTo").value,stuckAt:$("#stuckAt").value,stage:stage,kp:kpVal,missing:missing,
  sentence:"我在第 "+($("#stuckAt").value||"?")+" 步卡住（独立完成到第 "+($("#doneTo").value||"?")+" 步），属于"+stage+"，因为"+missing,
  solution:sol,rebuttal:state.aiRebuttal||"",
  aiReview:state.aiResult?{checked:true,decision:state.aiDecision,agree:!!state.aiResult.agree,ts:today()}:{checked:false}};
 m.status="attributed";
 m.review.stageIdx=0;m.review.next=addDays(1);

}

 attributed().forEach(function(m){var r=m.attrib&&m.attrib.aiReview;
  if(!r||!r.checked)c.未校对++;
  else if(r.decision==="驳回")c.驳回++;
  else if(r.decision==="修正")c.修正++;
  else c.一致++;});
 return "一致 "+c.一致+" · 修正 "+c.修正+" · 驳回 "+c.驳回+" · 未校对 "+c.未校对;
}
function aiDiagnose(){
 var cfg=aiCfg();
 if(!cfg.key||!cfg.endpoint){toast("先点右上角「AI 设置」配置接口和 Key");return}
 var m=state.cur;
 var missing=$("#missing").value.trim();
 if(!missing){toast("先自己写「缺的思维动作」——AI 校对的是你写的归因，不是替你写");return}
 var s=document.querySelector("#stageChips .chip.on");var stage=s?s.textContent:"";
 var kpChip=document.querySelector("#kpChips .chip.on");var kp=kpChip?kpChip.textContent:"";
 $("#aiBox").innerHTML='<div class="alert a">AI 正在看图诊断…</div>';
 var userContent=[{type:"text",text:"【学生自评归因】错因知识点："+(kp||"未填")+"；思维段："+(stage||"未填")+"；卡在第 "+($("#stuckAt").value||"?")+" 步（独立完成到第 "+($("#doneTo").value||"?")+" 步）；缺的思维动作："+missing+"。\n【题目标签】"+(m.tags.join("、")||"无")+"\n请对照照片中的题目与学生错解，校对其自评归因是否准确，并给出你的参考定位。"}];
 (m.photos||[]).forEach(function(p){userContent.push({type:"image_url",image_url:{url:p}})});
 fetch(cfg.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
  body:JSON.stringify({model:cfg.model,temperature:0.2,messages:[
   {role:"system",content:"你是人教版高二化学（化学反应原理/物质结构与性质/有机化学基础）错题诊断专家。学生给出自评归因，你对照题目照片和学生错解，判断其归因是否准确并给出参考定位。只输出一个 JSON 对象，不要任何其他文字。格式：{\"kp\":\"错因知识点\",\"stage\":\"看不出|想不到|推不动|写不好\",\"stuckAt\":\"卡住的步骤描述\",\"missing\":\"缺的思维动作（一句话，具体到本题）\",\"agree\":true或false,\"comment\":\"给学生的一句话点评\"}"},
   {role:"user",content:userContent}]})
 }).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error&&d.error.message||("HTTP "+r.status));return d})})
 .then(function(d){
  var txt=d.choices[0].message.content||"";
  var obj=JSON.parse(txt.trim().replace(/^```json?/,"").replace(/```$/,"").trim());
  state.aiResult=obj;state.aiDecision=null;state.aiRebuttal="";renderAICard();
 }).catch(function(e){$("#aiBox").innerHTML='<div class="alert red">AI 调用失败：'+esc(e.message||e)+"。可能是接口/Key 不对、网络不通，或服务商不允许浏览器直连（CORS）——回来告诉我，我加本地代理。</div>"});
}
function renderAICard(){
 var a=state.aiResult;if(!a||!$("#aiBox"))return;
 var agree=a.agree?'<span class="badge b-g">AI 认同你的归因</span>':'<span class="badge b-a">AI 有不同意见</span>';
 var dec=state.aiDecision?'<span class="badge b-p">你的处理：'+esc(state.aiDecision)+"</span>":"";
 $("#aiBox").innerHTML='<div class="alert '+(a.agree?"g":"a")+'"><b>AI 参考定位</b>'+agree+dec+'<br>错因知识点：<b>'+esc(a.kp)+"</b>　思维段：<b>"+esc(a.stage)+"</b>　卡点：<b>"+esc(a.stuckAt)+"</b><br>缺的思维动作："+esc(a.missing)+"<br>点评："+esc(a.comment)+"</div>"
 +'<div class="chips"><button class="btn pri sm" onclick="useAI()">按 AI 修正我的归因</button>'
 +'<button class="btn ghost sm" onclick="keepMine()">坚持我的'+(a.agree?"（AI 认同）":"（写一句理由）")+"</button></div>"
 +'<div id="rebutBox"></div>';
}
function useAI(){
 var a=state.aiResult;if(!a)return;
 $("#missing").value=a.missing||"";
 if(a.stuckAt&&/^\d+$/.test(String(a.stuckAt)))$("#stuckAt").value=a.stuckAt;
 [].forEach.call(document.querySelectorAll("#stageChips .chip"),function(c){c.className="chip"+(c.textContent===a.stage?" on":"")});
 [].forEach.call(document.querySelectorAll("#kpChips .chip"),function(c){c.className="chip"+(c.textContent===a.kp?" on":"")});
 state.aiDecision="修正";state.aiRebuttal="";
 updateSent();renderAICard();
 toast("已按 AI 修正——请自己再读一遍，这是你的归因");
}
function keepMine(){
 if(state.aiResult&&state.aiResult.agree){state.aiDecision="一致";state.aiRebuttal="";renderAICard();toast("已维持你的归因（AI 认同）");return}
 $("#rebutBox").innerHTML='<label>坚持我的归因，请写一句理由（必填）</label><textarea id="rebuttal" placeholder="例：AI 没看到我第二步已经用了守恒，我是算错不是没想到"></textarea><button class="btn pri sm" onclick="confirmKeep()">提交理由</button>';
}
function confirmKeep(){
 var t=$("#rebuttal").value.trim();
 if(!t){toast("请写一句理由——能驳倒 AI 的理由才是真想明白了");return}
 state.aiDecision="驳回";state.aiRebuttal=t;renderAICard();
 toast("已记录你的理由，会随归因保存");
}

function exportJSON(){
 var data={app:"chem-loop",version:"3.3",exported:today(),tags:TAGS,recent:state.recent,mistakes:M};
 var blob=new Blob([JSON.stringify(data)],{type:"application/json"});
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="化学错题备份-"+today()+".json";a.click();
 toast("已导出，请妥善保存（建议手机电脑各存一份）");
}
function importJSON(file){
 if(!file)return;var fr=new FileReader();
 fr.onload=function(){try{var d=JSON.parse(fr.result);
  if(d.mistakes&&confirm("导入 "+d.mistakes.length+" 条记录？（同 id 覆盖）")){
   Promise.all(d.mistakes.map(save)).then(function(){if(d.recent)state.recent=d.recent;render();toast("导入完成")});
  }}catch(e){toast("文件解析失败，请确认是本工具导出的 JSON")}};
 fr.readAsText(file);
}

document.addEventListener("input",function(e){if(e.target.id==="doneTo"||e.target.id==="stuckAt"||e.target.id==="missing")updateSent()});
DB.all().then(function(rows){M=rows.sort(function(a,b){return b.id-a.id});render()});
</script>
</body>
